services:
  mysql:
    image: mysql:8.4
    container_name: araf_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: araf_ecommerce
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: araf_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: araf_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  jaeger:
    image: jaegertracing/all-in-one:1.59
    container_name: araf_jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.106.1
    container_name: araf_otel_collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "14317:4317"
      - "14318:4318"
    depends_on:
      - jaeger

  api:
    build: .
    container_name: araf_api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      otel-collector:
        condition: service_started
    environment:
      DATABASE_URL: mysql+pymysql://root:root@mysql:3306/araf_ecommerce
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      SECRET_KEY: change-this-secret-key
      APP_ENV: development
      LOG_LEVEL: INFO
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      REQUEST_TIMEOUT_SECONDS: 30
      MAX_REQUEST_SIZE_BYTES: 1048576
      LOGIN_MAX_ATTEMPTS: 5
      LOGIN_LOCK_MINUTES: 15
      OTEL_ENABLED: true
      OTEL_SERVICE_NAME: araf-ecommerce-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      API_PREFIX: /api/v1
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_PASSWORD: admin123
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/code

volumes:
  mysql_data:
